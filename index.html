<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Fieldnotes</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<header class="topbar">
  <h1>Fieldnotes</h1>
  <div class="topbar-right">
    <span id="streak" class="chip streak" title="Consecutive days with an observation">—</span>
    <button id="btn-data" class="icon-btn" aria-label="Data and settings">⚙</button>
  </div>
</header>

<main id="view" class="view"></main>

<nav class="tabbar">
  <button class="tab" data-view="capture"><span>✎</span>Capture</button>
  <button class="tab" data-view="feed"><span>☰</span>Feed</button>
  <button class="tab" data-view="entities"><span>◎</span>Entities</button>
  <button class="tab" data-view="questions"><span>?</span>Questions</button>
  <button class="tab" data-view="brief"><span>▤</span>Brief</button>
</nav>

<div id="sheet" class="sheet hidden">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="sheet-title">Data</h2>
      <button id="sheet-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div id="sheet-content"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
